services:
  - type: web
    name: til-bilgirlery-live
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: til-bilgirlery-db
          property: connectionString

databases:
  - name: til-bilgirlery-db
    databaseName: til_bilgirlery
    user: til_bilgirlery_user
